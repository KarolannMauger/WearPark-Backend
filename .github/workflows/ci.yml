name: CI

on:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Unit tests + JaCoCo report
        run: mvn -B verify

      - name: Enforce coverage >= 80% and write coverage.json
        env:
          COVERAGE_THRESHOLD: "0.80"
        run: |
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          import json

          report_path = "target/site/jacoco/jacoco.xml"
          threshold = float(os.environ.get("COVERAGE_THRESHOLD", "0.80"))

          if not os.path.exists(report_path):
            print(f"JaCoCo report not found: {report_path}")
            sys.exit(1)

          tree = ET.parse(report_path)
          root = tree.getroot()

          counter = None
          for c in root.findall("counter"):
            if c.get("type") == "LINE":
              counter = c
              break

          if counter is None:
            print("No LINE counter found in JaCoCo report")
            sys.exit(1)

          missed = int(counter.get("missed", "0"))
          covered = int(counter.get("covered", "0"))
          total = missed + covered
          coverage = (covered / total) if total > 0 else 0.0

          print(f"Line coverage: {coverage:.2%}")
          with open("coverage.json", "w", encoding="utf-8") as f:
            json.dump({"totals": {"percent_covered": round(coverage * 100, 2)}}, f)

          if coverage < threshold:
            print(f"Coverage ниже {threshold:.0%}")
            sys.exit(1)
          PY

      - name: Start backend
        env:
          MONGODB_CLIENT_URI: mongodb://localhost:27017/
          MONGODB_DB_NAME: wearpark-ci
          JWT_SECRET: ci-secret-abcdefghijklmnopqrstuvwxyz
        run: |
          nohup mvn -B spring-boot:run > backend.log 2>&1 &
          for i in {1..30}; do
            http_ok=0
            netty_ok=0
            if nc -z localhost 8080; then http_ok=1; fi
            if nc -z localhost 9000; then netty_ok=1; fi
            if [ "$http_ok" -eq 1 ] && [ "$netty_ok" -eq 1 ]; then
              echo "Backend is up (HTTP 8080, Netty 9000)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: E2E tests
        working-directory: e2e
        env:
          DB_TEST_URI: mongodb://localhost:27017/
          DB_TEST_DNNAME: wearpark-ci
          HTTP_TEST_HOST: localhost
          HTTP_TEST_PORT: "8080"
          NETTY_TEST_HOST: localhost
          NETTY_TEST_PORT: "9000"
          NETTY_TEST_CA_CERT_PATH: ./certs/ca-test.crt
          NETTY_TEST_DEVICE_KEY_PATH: ./certs/device-test.key
          NETTY_TEST_DEVICE_CERT_PATH: ./certs/device-test.crt
        run: |
          npm ci
          npm test

      - name: Notify Teams on failure
        if: failure()
        run: |
          if [ -z "${{ secrets.MS_TEAMS_WEBHOOK_URL }}" ]; then
            echo "MS_TEAMS_WEBHOOK_URL not set; skipping Teams notification."
            exit 0
          fi
          payload=$(cat << 'EOF'
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "summary": "WearPark CI Pipeline Failed",
            "themeColor": "FF0000",
            "title": "CI Pipeline Failed",
            "sections": [
              {
                "activityTitle": "Branch: ${{ github.ref_name }}",
                "activitySubtitle": "Workflow: ${{ github.workflow }}",
                "facts": [
                  { "name": "Repository", "value": "${{ github.repository }}" },
                  { "name": "Actor", "value": "${{ github.actor }}" },
                  { "name": "Commit", "value": "${{ github.sha }}" }
                ],
                "markdown": true
              },
              {
                "activityTitle": "Issue Details",
                "text": "**Test Failure or Coverage < 80%**\n\nClick below to view the full details and logs.",
                "markdown": true
              }
            ],
            "potentialAction": [
              {
                "@type": "OpenUri",
                "name": "View Workflow Run",
                "targets": [
                  {
                    "os": "default",
                    "uri": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
          EOF
          )

          curl -X POST -H "Content-Type: application/json" \
               -d "$payload" \
               "${{ secrets.MS_TEAMS_WEBHOOK_URL }}"

      - name: Comment PR with results
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const fs = require('fs');
              
              // Check if coverage file exists
              if (!fs.existsSync('coverage.json')) {
                console.log('No coverage.json found');
                return;
              }
              
              const coverage = JSON.parse(fs.readFileSync('coverage.json', 'utf8'));
              const percent = coverage.totals.percent_covered;
              
              const status = percent >= 80 ? '✅' : '❌';
              const mergeStatus = percent >= 80 ? '✅ PR can be merged' : '🚫 PR blocked - coverage below 80%';
              const comment = `## CI Test Results\n\n${status} **Coverage:** ${percent.toFixed(2)}% (threshold: 80%)\n${mergeStatus}`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Failed to post comment:', error.message);
              // Don't fail the workflow if comment fails
            }
